name: Self-Defending IoT Network Tests (Phases 1–4)

on:
  push:
    branches:
      - main
      - phase4/automated-network-protection
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  full-test-suite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Mosquitto MQTT broker
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app.py src tests

      - name: Run all phase tests
        run: python -m unittest discover -s tests -v
